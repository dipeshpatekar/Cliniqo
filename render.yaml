services:
  - type: web
    name: cliniqo-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://tauri.localhost,tauri://localhost,http://localhost:8443
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cliniqo_prod
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_ISSUER
        value: cliniqo-backend
      - key: JWT_AUDIENCE
        value: cliniqo-client
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: OUTBOX_ENCRYPTION_KEY
        sync: false
