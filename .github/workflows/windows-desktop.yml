name: Windows Desktop CI & Security Verification

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify-windows:
    name: Build & Verify Windows Desktop (x86_64 MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          STORE_PATH=$(pnpm store path --silent)
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_OUTPUT
          echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Cargo Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm --prefix backend install --frozen-lockfile

      - name: Run Rust Security & DPAPI Tests (Native Windows Kernel)
        # Note: Runs native Windows DPAPI CryptProtectData, CryptUnprotectData,
        # zero-plaintext SQLite encryption, and session auth tests directly against LSASS.
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo build --bin verify_token --manifest-path src-tauri/Cargo.toml
          cargo build --bin verify_installer --manifest-path src-tauri/Cargo.toml

      - name: Run Frontend Tests
        run: pnpm test

      - name: Run Backend Tests & Lint
        run: |
          pnpm --prefix backend run lint
          pnpm --prefix backend test

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: https://cliniqo-backend-68x3.onrender.com
          CLINIQO_BACKEND_URL: https://cliniqo-backend-68x3.onrender.com
        run: pnpm build

      - name: Build Backend Application
        run: pnpm --prefix backend build

      - name: Build Tauri Windows Desktop Shell & NSIS Installer
        # Generates production NSIS setup installer (.exe) for Windows distribution.
        # Fails immediately if TAURI_SIGNING_PRIVATE_KEY is missing on release branch or tag.
        env:
          VITE_API_BASE_URL: https://cliniqo-backend-68x3.onrender.com
          CLINIQO_BACKEND_URL: https://cliniqo-backend-68x3.onrender.com
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          IS_RELEASE=false
          if [[ "${{ github.ref }}" == refs/heads/release/* ]] || [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            IS_RELEASE=true
          fi

          # 1. Clean any stale installer and updater artifacts from cached target
          rm -rf src-tauri/target/release/bundle/nsis
          rm -rf src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          rm -rf src-tauri/target/*/release/bundle/nsis
          rm -rf src-tauri/target/release/bundle/updater
          rm -rf src-tauri/target/*/release/bundle/updater

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Building with Minisign updater code signing and updater artifacts enabled..."
            pnpm tauri build --bundles nsis
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required for production/release builds but was not found."
            exit 1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY secret not detected on non-release branch. Building NSIS installer without updater signatures..."
            pnpm tauri build --bundles nsis --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Generate latest.json Manifest for Auto-Updater
        shell: bash
        run: |
          node scripts/generate-updater-manifest.js

          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_EXE="Cliniqo_${VERSION}_x64-setup.exe"
          EXPECTED_SIG="${EXPECTED_EXE}.sig"

          EXE_PATH=""
          SIG_PATH=""
          for CANDIDATE in "src-tauri/target/release/bundle/nsis" "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"; do
            if [ -f "${CANDIDATE}/${EXPECTED_EXE}" ]; then
              EXE_PATH="${CANDIDATE}/${EXPECTED_EXE}"
              SIG_PATH="${CANDIDATE}/${EXPECTED_SIG}"
              break
            fi
          done

          if [ -z "$EXE_PATH" ]; then
            echo "::error::Installer binary ${EXPECTED_EXE} not found."
            exit 1
          fi

          if [ -z "$SIG_PATH" ] || [ ! -f "$SIG_PATH" ]; then
            echo "::error::Installer signature ${EXPECTED_SIG} not found."
            exit 1
          fi

          echo "Verifying generated installer signature against embedded Minisign public key..."
          cargo run --bin verify_installer --manifest-path src-tauri/Cargo.toml -- "$EXE_PATH" "$SIG_PATH"

      - name: Archive Windows NSIS Installer & Updater Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Cliniqo-Windows-Setup-x64
          path: |
            src-tauri/target/**/bundle/nsis/Cliniqo_*_x64-setup.exe
            src-tauri/target/**/bundle/nsis/Cliniqo_*_x64-setup.exe.sig
            src-tauri/target/**/bundle/nsis/latest.json
            resources/Medicine_Import_Template.xlsx
            resources/Medicine_Import_Template.csv
            resources/README.txt
          retention-days: 14
          if-no-files-found: error

      - name: Publish Release Assets & Updater Manifest to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/bundle/nsis/Cliniqo_*_x64-setup.exe
            src-tauri/target/**/bundle/nsis/Cliniqo_*_x64-setup.exe.sig
            src-tauri/target/**/bundle/nsis/latest.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true

# ---------------------------------------------------------------------------
# MANUAL VS CI TEST DISTINCTION:
#
# Tests Automated in this CI Pipeline:
# 1. Native Windows DPAPI CryptProtectData / CryptUnprotectData round-trips.
# 2. Key zeroization and memory cleanup validation.
# 3. SQLite AES-256-GCM zero-plaintext database operations and migrations.
# 4. JWT signature verification, session isolation, and cross-clinic rejection.
# 5. Production release packaging and NSIS installer generation.
#
# Tests Requiring Interactive/Manual Execution on Physical Windows Machines:
# 1. NSIS installer execution with User Account Control (UAC) elevation.
# 2. Desktop WebView2 runtime initialization and GPU hardware acceleration.
# 3. DPAPI key persistence across user logoff and machine reboot.
# 4. Offline SQLite file locking semantics across simultaneous app launches.
# ---------------------------------------------------------------------------
