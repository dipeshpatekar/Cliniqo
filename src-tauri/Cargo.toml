[package]
name = "cliniqo-desktop"
version = "1.0.0"
default-run = "cliniqo-desktop"
description = "Cliniqo — Clinic Management Desktop Application"
authors = ["Cliniqo Team"]
license = "Proprietary"
repository = "https://github.com/dipeshpatekar/Cliniqo"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
jsonwebtoken = "9"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
